version: '3.8'
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - JWT_SECRET=supersecretkey
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: securedb
    ports:
      - "5432:5432"
